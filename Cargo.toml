[package]
name = "pict-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of Microsoft's PICT pairwise independent combinatorial testing engine"
license = "MIT"
readme = "README.md"
keywords = ["pict", "combinatorial", "testing", "pairwise", "ffi"]
categories = ["algorithms", "development-tools::testing"]

[lib]
name = "pict"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 3
